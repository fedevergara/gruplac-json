[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "gruplac-json"
dynamic = ["version"]
description = "Turn a research group's public GrupLAC page (Minciencias, Colombia) into one JSON document, in the cvlac-json schema, with member affiliations and Scienti ids."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Diego Restrepo", email = "restrepo@udea.edu.co" }]
keywords = ["gruplac", "cvlac", "scienti", "minciencias", "colombia", "bibliometrics", "cris", "impactu", "research groups"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = ["cvlac-json>=0.7"]   # shares the record schema, ROR and Scienti helpers

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.3", "build>=1.2", "twine>=5"]

[project.scripts]
gruplac-json = "gruplac_json.cli:main"

[project.urls]
Homepage = "https://github.com/restrepo/gruplac-json"
Repository = "https://github.com/restrepo/gruplac-json"
Issues = "https://github.com/restrepo/gruplac-json/issues"
Changelog = "https://github.com/restrepo/gruplac-json/blob/main/CHANGELOG.md"

# Version from the git tag (v0.1.0 -> 0.1.0); commits after a tag get 0.1.1.devN
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"   # PyPI and TestPyPI reject local versions (+g1234abc)

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/gruplac_json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["gruplac_json"]
branch = true

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E731",    # small lambdas assigned to names
    "SIM108",  # ternaries are not always clearer
    "RUF001", "RUF002", "RUF003",  # Spanish text with accents and typographic quotes
]
